<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>{{fullName}} QR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{firstName}} QR">
<meta name="theme-color" content="#ffffff">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  .logo {
    max-width: 220px;
    max-height: 56px;
    width: auto;
    height: auto;
    margin-bottom: 28px;
    display: block;
  }
  .qr-wrap {
    width: 100%;
    max-width: 420px;
  }
  .qr-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }
  .caption {
    margin-top: 20px;
    text-align: center;
  }
  .caption .name {
    font-size: 18px;
    font-weight: 800;
    color: #16181d;
    margin: 0;
  }
  .caption .sub {
    font-size: 13px;
    color: #6b7280;
    margin: 2px 0 0;
  }
  .hint {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #a1a1aa;
  }
</style>
</head>
<body>
  <div class="screen">
    {{#hasLogo}}<img class="logo" src="../{{logoFile}}" alt="{{company}}">{{/hasLogo}}
    <div class="qr-wrap">
      <img src="qr.svg" alt="Scan to open {{fullName}}'s contact card">
    </div>
    <div class="caption">
      <p class="name">{{fullName}}</p>
      <p class="sub">{{jobTitle}} · {{company}}</p>
    </div>
  </div>
  <div class="hint">Scan to save contact</div>
</body>
</html>
